[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "webscope"
dynamic = ["version"]
description = "CLI de reconocimiento pasivo: de qué trata una web, su infraestructura (IPs, red, DNS, CDN/WAF), TLS y postura de seguridad visible con hallazgos priorizados."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alvaro Aramayo Chain" }]
keywords = ["cli", "web", "recon", "osint", "security-headers", "tls", "dns", "technology-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "typer>=0.12",
    "dnspython>=2.4",
    "certifi>=2023.7.22",
]

[project.optional-dependencies]
fast = ["lxml>=5.0"]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.5",
    "lxml>=5.0",
]

[project.scripts]
webscope = "webscope.cli:main"

[project.urls]
Homepage = "https://github.com/AlvaroAramayoChain/webscope"
Issues = "https://github.com/AlvaroAramayoChain/webscope/issues"
Changelog = "https://github.com/AlvaroAramayoChain/webscope/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/webscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/webscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# SIM905: las listas de stopwords se leen mejor como texto con .split().
ignore = ["RUF001", "RUF002", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# Las firmas son una tabla declarativa: una tecnología por línea.
"src/webscope/analyzers/tech.py" = ["E501"]
"src/webscope/analyzers/infra.py" = ["E501"]
"src/webscope/analyzers/category.py" = ["E501"]
"src/webscope/analyzers/topic.py" = ["E501"]
# Textos de la interfaz: una cadena por línea se lee mejor que partida.
"src/webscope/i18n.py" = ["E501"]
